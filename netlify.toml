# Consumer mini-app = site root (/). Admin = /admin.html (same dist from root Vite build).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

# React Router fallback so customer routes such as /carwash can be opened directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
